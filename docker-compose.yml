# Full Tyk stack + Keycloak + the edp-migration tool, for the EDP Migration
# POC (see README.md). Host ports (the *_HOST_PORT variables) default to
# plain/standard values (won't collide with this stack specifically, but
# will with any other local Tyk/Postgres/Redis/Keycloak already using
# their own standard ports) — run `./up.sh --dev-ports` to switch them to
# a shifted (13000-style) set instead. These only affect reaching a
# service from your own host machine's browser/curl/etc — the edp-migrate
# service itself is a container on this same docker network, so its own
# Setup wizard prefill (confs/edp-migrate.env) always addresses every
# other service by its real internal docker service name + real internal
# port, completely independent of *_HOST_PORT.
services:
  tyk-postgres:
    image: postgres:18
    environment:
      - POSTGRES_DB=tyk_analytics
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=topsecretpassword
      - PGDATA=/var/lib/postgresql/18/docker
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tyk

  # One-shot: creates the tyk_portal and keycloak databases that
  # POSTGRES_DB above doesn't (tyk-ent-portal and keycloak each need
  # their own). Previously a postgres-init/ bind mount into Postgres's own
  # docker-entrypoint-initdb.d, which only ever runs against a
  # genuinely-fresh (empty) data volume — confirmed unreliable two
  # different ways: Docker Desktop's file-sharing can refuse the bind
  # mount outright ("mounts denied"), and even when the mount itself
  # works, a volume that isn't perfectly fresh (e.g. reused from an
  # interrupted earlier run) silently skips initdb.d forever, leaving
  # both databases permanently missing with no error until tyk-ent-portal
  # and keycloak crash-loop trying to connect. An explicit init
  # container — depended on by both, same pattern as edp-migrate-init
  # below — creates them itself over the network instead, idempotently
  # (safe even if they already exist), independent of the volume's own
  # history.
  tyk-postgres-init:
    image: postgres:18
    environment:
      - PGPASSWORD=topsecretpassword
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        for db in tyk_portal keycloak; do
          exists=$$(psql -U postgres -h tyk-postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$$db'")
          if [ "$$exists" = "1" ]; then
            echo "$$db already exists, skipping"
          else
            psql -U postgres -h tyk-postgres -c "CREATE DATABASE $$db"
            echo "created $$db"
          fi
        done
    depends_on:
      tyk-postgres:
        condition: service_healthy
    networks:
      - tyk

  tyk-redis:
    image: redis
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - tyk

  tyk-gateway:
    image: tykio/tyk-gateway-ee:${GATEWAY_VERSION:-v5.13.2}
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    env_file:
      - ./confs/tyk.env
    depends_on:
      - tyk-dashboard
    networks:
      - tyk

  tyk-dashboard:
    image: tykio/tyk-dashboard:${DASHBOARD_VERSION:-v5.13.2}
    environment:
      - TYK_DB_LICENSEKEY=${DASH_LICENSE:?Dashboard license missing — copy .env.example to .env and set DASH_LICENSE (see README.md prerequisites)}
      - TYK_DB_STORAGE_MAIN_TYPE=postgres
      - TYK_DB_STORAGE_MAIN_CONNECTIONSTRING=user=postgres password=topsecretpassword host=tyk-postgres port=5432 database=tyk_analytics
    depends_on:
      tyk-postgres:
        condition: service_healthy
    ports:
      - "${DASHBOARD_HOST_PORT:-3000}:3000"
    env_file:
      - ./confs/tyk_analytics.env
    networks:
      - tyk

  tyk-ent-portal:
    image: tykio/portal:${PORTAL_VERSION:-v1.17.3}
    user: root
    command: --bootstrap
    depends_on:
      tyk-postgres-init:
        condition: service_completed_successfully
    ports:
      - "${PORTAL_HOST_PORT:-3001}:3001"
    environment:
      - PORTAL_LICENSEKEY=${DASH_LICENSE:?Dashboard license missing — copy .env.example to .env and set DASH_LICENSE (see README.md prerequisites)}
      # Overrides confs/tyk_portal.env's own placeholder — up.sh generates
      # a real value into .env on first run (see up.sh's own comment).
      - ADMIN_EMAIL=${EDP_ADMIN_EMAIL:-admin@example-poc.dev}
      - ADMIN_PASSWORD=${EDP_ADMIN_PASSWORD:-change-me-see-env-example}
    env_file:
      - ./confs/tyk_portal.env
    networks:
      - tyk
    volumes:
      - portal-data:/opt/portal/themes

  tyk-pump:
    image: tykio/tyk-pump-docker-pub:${PUMP_VERSION:-v1.17.0}
    env_file:
      - ./confs/pump.env
      - ./confs/pump.postgres.env
    depends_on:
      tyk-postgres:
        condition: service_healthy
    networks:
      - tyk

  keycloak:
    image: keycloak/keycloak:${KEYCLOAK_VERSION:-latest}
    depends_on:
      tyk-postgres-init:
        condition: service_completed_successfully
    networks:
      - tyk
    ports:
      - "${KEYCLOAK_HOST_PORT:-8180}:8180"
    command:
      - start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: tyk-postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: topsecretpassword
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin1234}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: 8180
      # Must match the *host-side* port above (KEYCLOAK_HOST_PORT), not the
      # container's own internal 8180 — this is what browsers/curl from
      # outside the docker network actually use.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_HOST_PORT:-8180}
      # v2 hostname provider (Keycloak 26+): without this, a request that
      # arrives on a hostname other than KC_HOSTNAME (e.g. the classic
      # Dashboard calling a DCR registration endpoint via the internal
      # docker-network hostname keycloak:8180, not localhost) fails token
      # decoding.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"

  # One-shot: a fresh named volume is created root:root 0755 by Docker,
  # which the edp-migrate image below can never write to on its own — its
  # base image (gcr.io/distroless/static-debian12:nonroot) runs as UID
  # 65532 and has no shell/chown binary of its own to fix this from the
  # inside (confirmed live: even Phase 0's very first config save 403s
  # with "permission denied" without this). Runs once, before edp-migrate,
  # and exits.
  edp-migrate-init:
    image: busybox
    command: ["sh", "-c", "chown -R 65532:65532 /data"]
    volumes:
      - edp-migrate-data:/data

  # The tool this whole POC exists to demonstrate. With no arguments it
  # serves the Phase 0 setup wizard on :9090 — open http://localhost:9090
  # once every service above is healthy and seed.sh has populated some
  # Classic Portal data to migrate.
  #
  # Pulled as a published image, not built from source (`context: ..`)
  # — this directory is meant to stand alone as its own public repo,
  # without the tool's own source tree as a sibling. Override
  # EDP_MIGRATE_IMAGE in .env to point at ghcr.io instead of Docker Hub,
  # or pin a specific released version instead of :latest.
  edp-migrate:
    image: ${EDP_MIGRATE_IMAGE:-docker.io/ataimo007/edp-migrate:latest}
    ports:
      - "${EDP_MIGRATE_HOST_PORT:-9090}:9090"
    # confs/edp-migrate.env prefills every component straight to its real
    # internal docker service name + real internal port (edp-migrate is
    # itself a container on this same "tyk" network, so it reaches every
    # other service directly — this never needs to change even when this
    # stack's own *_HOST_PORT values do, since a host-side port mapping
    # doesn't apply to container-to-container traffic at all).
    env_file:
      - ./confs/edp-migrate.env
    # Docker Desktop (Mac/Windows) resolves host.docker.internal inside a
    # container automatically; plain Linux Docker needs this explicit
    # mapping (Docker 20.10+) for the same DNS name to work there too —
    # kept for anyone who sets the fallback EDP_MIGRATE_HOST themselves to
    # reach something on the host machine instead of this docker stack.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - edp-migrate-data:/data
    depends_on:
      edp-migrate-init:
        condition: service_completed_successfully
      tyk-dashboard:
        condition: service_started
      tyk-ent-portal:
        condition: service_started
    networks:
      - tyk

  # Real, working upstream for every API scripts/seed.sh creates (PROXY_TARGET,
  # scripts/lib/apidef.sh) — reachable from tyk-gateway over this same docker
  # network as http://httpbin:80, and from your own host (for a direct sanity
  # check outside the Gateway) at HTTPBIN_HOST_PORT below.
  httpbin:
    image: kennethreitz/httpbin
    ports:
      - "${HTTPBIN_HOST_PORT:-8091}:80"
    networks:
      - tyk

volumes:
  redis-data:
  postgres-data:
  portal-data:
  edp-migrate-data:

networks:
  tyk:
