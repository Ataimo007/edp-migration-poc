# Full Tyk stack + Keycloak + the edp-migration tool, for the EDP Migration
# POC (see README.md). Host ports (the *_HOST_PORT variables) default to
# plain/standard values (won't collide with this stack specifically, but
# will with any other local Tyk/Postgres/Redis/Keycloak already using
# their own standard ports) — run `./up.sh --dev-ports` to switch them to
# a shifted (13000-style) set instead. These only affect reaching a
# service from your own host machine's browser/curl/etc — the edp-migrate
# service itself is a container on this same docker network, so its own
# Setup wizard prefill (confs/edp-migrate.env) always addresses every
# other service by its real internal docker service name + real internal
# port, completely independent of *_HOST_PORT.
services:
  tyk-postgres:
    image: postgres:18
    environment:
      - POSTGRES_DB=tyk_analytics
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=topsecretpassword
      - PGDATA=/var/lib/postgresql/18/docker
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tyk

  # One-shot: creates the tyk_portal and keycloak databases that
  # POSTGRES_DB above doesn't (tyk-ent-portal and keycloak each need
  # their own). Previously a postgres-init/ bind mount into Postgres's own
  # docker-entrypoint-initdb.d, which only ever runs against a
  # genuinely-fresh (empty) data volume — confirmed unreliable two
  # different ways: Docker Desktop's file-sharing can refuse the bind
  # mount outright ("mounts denied"), and even when the mount itself
  # works, a volume that isn't perfectly fresh (e.g. reused from an
  # interrupted earlier run) silently skips initdb.d forever, leaving
  # both databases permanently missing with no error until tyk-ent-portal
  # and keycloak crash-loop trying to connect. An explicit init
  # container — depended on by both, same pattern as edp-migrate-init
  # below — creates them itself over the network instead, idempotently
  # (safe even if they already exist), independent of the volume's own
  # history.
  tyk-postgres-init:
    image: postgres:18
    environment:
      - PGPASSWORD=topsecretpassword
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        for db in tyk_portal keycloak; do
          exists=$$(psql -U postgres -h tyk-postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$$db'")
          if [ "$$exists" = "1" ]; then
            echo "$$db already exists, skipping"
          else
            psql -U postgres -h tyk-postgres -c "CREATE DATABASE $$db"
            echo "created $$db"
          fi
        done
    depends_on:
      tyk-postgres:
        condition: service_healthy
    networks:
      - tyk

  tyk-redis:
    image: redis
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - tyk

  tyk-gateway:
    image: tykio/tyk-gateway-ee:${GATEWAY_VERSION:-v5.13.2}
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    env_file:
      - ./confs/tyk.env
    depends_on:
      - tyk-dashboard
    networks:
      - tyk

  tyk-dashboard:
    image: tykio/tyk-dashboard:${DASHBOARD_VERSION:-v5.13.2}
    environment:
      - TYK_DB_LICENSEKEY=${DASH_LICENSE:?Dashboard license missing — copy .env.example to .env and set DASH_LICENSE (see README.md prerequisites)}
      - TYK_DB_STORAGE_MAIN_TYPE=postgres
      - TYK_DB_STORAGE_MAIN_CONNECTIONSTRING=user=postgres password=topsecretpassword host=tyk-postgres port=5432 database=tyk_analytics
      # Overrides confs/tyk_analytics.env's own checked-in
      # TYK_DB_HOSTCONFIG_GATEWAYHOSTNAME=localhost:18080 (environment:
      # always wins over env_file, regardless of listed order) — that
      # value drives the "API URL" this stack's own catalogue/seed output
      # shows an operator to actually call, so it needs to track this same
      # run's real GATEWAY_HOST_PORT (plain 8080 by default, 18080 only
      # under --dev-ports) instead of being stuck at one hardcoded value
      # forever regardless of which ports this run is actually using.
      - TYK_DB_HOSTCONFIG_GATEWAYHOSTNAME=localhost:${GATEWAY_HOST_PORT:-8080}
    depends_on:
      tyk-postgres:
        condition: service_healthy
    ports:
      - "${DASHBOARD_HOST_PORT:-3000}:3000"
    env_file:
      - ./confs/tyk_analytics.env
    networks:
      - tyk

  tyk-ent-portal:
    image: tykio/portal:${PORTAL_VERSION:-v1.17.3}
    user: root
    command: --bootstrap
    depends_on:
      tyk-postgres-init:
        condition: service_completed_successfully
    ports:
      - "${PORTAL_HOST_PORT:-3001}:3001"
    environment:
      - PORTAL_LICENSEKEY=${DASH_LICENSE:?Dashboard license missing — copy .env.example to .env and set DASH_LICENSE (see README.md prerequisites)}
      # Overrides confs/tyk_portal.env's own placeholder — up.sh generates
      # a real value into .env on first run (see up.sh's own comment).
      - ADMIN_EMAIL=${EDP_ADMIN_EMAIL:-admin@example-poc.dev}
      - ADMIN_PASSWORD=${EDP_ADMIN_PASSWORD:-change-me-see-env-example}
    env_file:
      - ./confs/tyk_portal.env
    networks:
      - tyk
    volumes:
      - portal-data:/opt/portal/themes

  tyk-pump:
    image: tykio/tyk-pump-docker-pub:${PUMP_VERSION:-v1.17.0}
    env_file:
      - ./confs/pump.env
      - ./confs/pump.postgres.env
    depends_on:
      tyk-postgres:
        condition: service_healthy
    networks:
      - tyk

  keycloak:
    image: keycloak/keycloak:${KEYCLOAK_VERSION:-latest}
    depends_on:
      tyk-postgres-init:
        condition: service_completed_successfully
    networks:
      - tyk
    ports:
      - "${KEYCLOAK_HOST_PORT:-8180}:8180"
    command:
      - start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: tyk-postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: topsecretpassword
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin1234}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: 8180
      # Must match the *host-side* port above (KEYCLOAK_HOST_PORT), not the
      # container's own internal 8180 — this is what browsers/curl from
      # outside the docker network actually use.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_HOST_PORT:-8180}
      # v2 hostname provider (Keycloak 26+): without this, a request that
      # arrives on a hostname other than KC_HOSTNAME (e.g. the classic
      # Dashboard calling a DCR registration endpoint via the internal
      # docker-network hostname keycloak:8180, not localhost) fails token
      # decoding.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"

  # One-shot: a fresh named volume is created root:root 0755 by Docker,
  # which the edp-migrate image below can never write to on its own — its
  # base image (gcr.io/distroless/static-debian12:nonroot) runs as UID
  # 65532 and has no shell/chown binary of its own to fix this from the
  # inside (confirmed live: even Phase 0's very first config save 403s
  # with "permission denied" without this). Runs once, before edp-migrate,
  # and exits.
  edp-migrate-init:
    image: busybox
    command: ["sh", "-c", "chown -R 65532:65532 /data"]
    volumes:
      - edp-migrate-data:/data

  # The tool this whole POC exists to demonstrate. With no arguments it
  # serves the Phase 0 setup wizard on :9090 — open http://localhost:9090
  # once every service above is healthy and seed.sh has populated some
  # Classic Portal data to migrate.
  #
  # Pulled as a published image, not built from source (`context: ..`)
  # — this directory is meant to stand alone as its own public repo,
  # without the tool's own source tree as a sibling. Override
  # EDP_MIGRATE_IMAGE in .env to point at ghcr.io instead of Docker Hub,
  # or pin a specific released version instead of :latest.
  edp-migrate:
    image: ${EDP_MIGRATE_IMAGE:-docker.io/ataimo007/edp-migrate:latest}
    ports:
      - "${EDP_MIGRATE_HOST_PORT:-9090}:9090"
    # confs/edp-migrate.env prefills every component straight to its real
    # internal docker service name + real internal port (edp-migrate is
    # itself a container on this same "tyk" network, so it reaches every
    # other service directly — this never needs to change even when this
    # stack's own *_HOST_PORT values do, since a host-side port mapping
    # doesn't apply to container-to-container traffic at all).
    env_file:
      - ./confs/edp-migrate.env
    # Docker Desktop (Mac/Windows) resolves host.docker.internal inside a
    # container automatically; plain Linux Docker needs this explicit
    # mapping (Docker 20.10+) for the same DNS name to work there too —
    # kept for anyone who sets the fallback EDP_MIGRATE_HOST themselves to
    # reach something on the host machine instead of this docker stack.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - edp-migrate-data:/data
    depends_on:
      edp-migrate-init:
        condition: service_completed_successfully
      tyk-dashboard:
        condition: service_started
      tyk-ent-portal:
        condition: service_started
    networks:
      - tyk

  # Real, working upstream for every API scripts/seed.sh creates (PROXY_TARGET,
  # scripts/lib/apidef.sh) — reachable from tyk-gateway over this same docker
  # network as http://httpbin:80, and from your own host (for a direct sanity
  # check outside the Gateway) at HTTPBIN_HOST_PORT below.
  httpbin:
    image: kennethreitz/httpbin
    ports:
      - "${HTTPBIN_HOST_PORT:-8091}:80"
    networks:
      - tyk

  # Seeds Classic Portal — scripts/seed.sh's own logic, running in its own
  # container instead of this devcontainer's own host shell, specifically
  # so its output lands somewhere the "locust" service below can also see
  # it.
  #
  # By default that's a plain host bind mount — poc-environment/.seed-state/
  # on your own machine, directly, no indirection — which is what you want
  # on a normal local Docker install. `./up.sh --seed-state-volume` (or
  # `-f docker-compose.yml -f docker-compose.namedvolume.yml` directly)
  # switches both this service and "locust" to a named Docker volume
  # instead, for the one case a host bind mount doesn't work: some
  # devcontainer/remote setups run Docker via a forwarded socket to a
  # *different* machine's Docker daemon (Docker-outside-of-Docker), which
  # only shares whatever host paths that other machine's own Docker
  # Desktop was configured to share — never this checkout's own location.
  # Confirmed live in exactly that kind of environment: every path tried
  # (this directory, .seed-state alone, even /tmp) failed identically with
  # "mounts denied ... not shared from the host". docker-compose.namedvolume.yml's
  # own comment has the full story; scripts/seed-state.sh reads that named
  # volume from the host when this flag is in use.
  #
  # Never started by a plain `docker compose up -d` (see its own
  # "profiles:" below) — ./up.sh invokes it explicitly instead, right
  # after scripts/bootstrap.sh:
  #
  #   docker compose run --rm seed --scale medium --auth-types authToken,basic
  #
  # env_file reads .env/.runtime.env straight off this devcontainer's own
  # disk at `docker compose run` time (the compose CLI parses those files
  # itself — no bind mount involved, so none of the sharing restriction
  # above applies to this part at all) — DASHBOARD_URL is the one
  # override needed on top: .runtime.env's own value is the host-
  # published port bootstrap.sh verified from *outside* the stack, but
  # this container has no host-port mapping of its own to reach back
  # through, only the internal network every other container already
  # uses.
  seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: scripts/seed/Dockerfile
    env_file:
      - .env
      - .runtime.env
    environment:
      - DASHBOARD_URL=http://tyk-dashboard:3000
      # Overridden to 1 by docker-compose.namedvolume.yml — lets seed.sh's
      # own closing summary tell the operator the right way to read
      # .seed-state/ (a direct host path by default, scripts/seed-state.sh
      # under that overlay) without needing to guess which mount is live.
      - SEED_STATE_VOLUME=0
    volumes:
      - ./.seed-state:/poc-environment/.seed-state
    depends_on:
      - tyk-dashboard
    networks:
      - tyk

  # Load-tests the APIs the "seed" service above creates, using the real
  # developer keys it issued — scripts/load-test/README.md has the full
  # story. Autostarts (entrypoint.sh's own --autostart) the moment it
  # comes up, one worker per available developer key — open
  # http://localhost:${LOCUST_HOST_PORT:-8089} any time just to watch it.
  #
  # NOT part of the always-up stack (see its own "profiles:" below) —
  # opt in with `./up.sh --load-test`, since it generates real, continuous
  # traffic against the Gateway the moment it starts. LOAD_TEST_RPS (per
  # worker, not aggregate — see locustfile.py's own wait_time) defaults
  # to 0.5, the same pace this always ran at before rate/quota became
  # separately configurable — safe now against a day of continuous
  # traffic because scripts/seed.sh's own --quota-min default is high
  # enough to absorb it (see that script's own comment on the exact
  # numbers), not because this got throttled down.
  #
  # entrypoint.sh waits for a .seed-state/run-*.yaml|json file to show up
  # (see "seed" service's own comment on where that actually lives — a
  # host bind mount by default, a named volume under --seed-state-volume)
  # before starting Locust for real, since this container starts (with
  # `docker compose up -d`) *before* up.sh gets around to running the
  # "seed" service above — there's a real race here otherwise. Because
  # that mount is genuinely live and shared with "seed" (not a one-time
  # copy), re-seeding after this container is already up still needs a
  # restart to pick up the new file — Locust only loads credentials once,
  # at its own startup, this doesn't change that — but the *file itself*
  # is visible immediately, with no copy step of any kind:
  #
  #   docker compose restart locust
  #
  # Reaches tyk-gateway over this same internal network (the "seed"
  # service's own recorded "internal_url" per API, http://tyk-gateway:8080/...)
  # — never a host-published port, so this works the same regardless of
  # --dev-ports or any other *_HOST_PORT override.
  locust:
    profiles: ["load-test"]
    build:
      context: ./scripts/load-test
    ports:
      - "${LOCUST_HOST_PORT:-8089}:8089"
    environment:
      - SEED_STATE_FILE=${SEED_STATE_FILE:-}
      - LOAD_TEST_RPS=${LOAD_TEST_RPS:-0.5}
    volumes:
      - ./.seed-state:/poc-environment/.seed-state
    depends_on:
      - tyk-gateway
    networks:
      - tyk

volumes:
  redis-data:
  postgres-data:
  portal-data:
  edp-migrate-data:

networks:
  tyk:
